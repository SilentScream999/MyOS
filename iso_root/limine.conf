# Timeout in seconds before auto-boot.
timeout: 0
# Suppress routine loader output while retaining loader panics and warnings.
quiet: yes
# Entry name shown in the boot menu. The leading slash is required.
/WyzarOS
	# Use the Limine boot protocol for our kernel.
	protocol: limine
	# Path to the kernel file relative to the partition containing limine.conf.
	# We copy the kernel as "wyzar" into /boot in the ISO, so:
	path: boot():/boot/wyzar
	module_path: boot():/boot/initrd.tar
	module_path: boot():/boot/init.elf
	module_path: boot():/boot/wallpaper.raw
